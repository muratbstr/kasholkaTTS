name: ZIP downloads

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: zip-download-counter
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Update ZIP download counter
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const path = "badges/downloads.json";
            const branch = "main";

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { ...repo, per_page: 100 }
            );

            let count = 0;
            for (const release of releases) {
              if (release.draft) continue;
              for (const asset of release.assets) {
                if (asset.name.toLowerCase().endsWith(".zip")) {
                  count += asset.download_count;
                }
              }
            }

            const text = JSON.stringify({
              schemaVersion: 1,
              label: "Скачивания",
              message: String(count),
              color: "00b000"
            }, null, 2) + "\n";

            let existing;
            try {
              const response = await github.rest.repos.getContent({
                ...repo, path, ref: branch
              });
              existing = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (existing) {
              if (existing.type !== "file" ||
                  existing.encoding !== "base64") {
                throw new Error("Unexpected badge file format");
              }

              const previous = Buffer.from(
                existing.content, "base64"
              ).toString("utf8");

              if (previous === text) {
                core.info(`Downloads unchanged: ${count}`);
                return;
              }
            }

            await github.rest.repos.createOrUpdateFileContents({
              ...repo,
              path,
              branch,
              message: "Update ZIP download counter",
              content: Buffer.from(text, "utf8").toString("base64"),
              ...(existing ? { sha: existing.sha } : {})
            });

            core.info(`ZIP downloads: ${count}`);
