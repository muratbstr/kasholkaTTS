name: ZIP downloads

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: zip-download-counter
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Count ZIP downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '[.[] | select(.draft == false) |
                .assets[] |
                select(.name | ascii_downcase | endswith(".zip")) |
                .download_count] | add // 0' |
            jq -s 'add // 0'
          )

          mkdir -p badges
          jq -n --argjson count "$count" '{
            schemaVersion: 1,
            label: "Скачивания",
            message: ($count | tostring),
            color: "00b000"
          }' > badges/downloads.json

      - name: Save updated counter
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/downloads.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update ZIP download counter"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
